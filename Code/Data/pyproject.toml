[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-methods-code"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["numpy", "scikit-learn"]

[project.optional-dependencies]
deep = ["torch", "torchvision"]

[tool.setuptools]
packages = ["Data"]